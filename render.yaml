services:
  - type: web
    name: transit-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: SEED_SKIP_AT_BOOT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: transit-db
          property: connectionString

databases:
  - name: transit-db
    plan: free